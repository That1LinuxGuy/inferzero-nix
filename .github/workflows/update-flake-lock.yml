name: Update flake.lock

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flake-lock
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update inferzero input
        run: nix flake lock --update-input inferzero

      # PRs created with GITHUB_TOKEN do not trigger pull_request workflows.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "flake.lock: update inferzero"
          title: "flake.lock: update inferzero"
          body: |
            Automated update of the locked inferzero source.

            CI will check the flake and build the package on this pull request.
          branch: automation/update-inferzero
          delete-branch: true
